org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.3 was tested against compileSdk 35; we run compileSdk 36 because
# android-36 is the only locally installed platform (D-013). AGP team's own
# recommended way to silence this specific warning while remaining on 8.7.3.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
